# Render Blueprint: deploys AIVA CRM as one free web service plus a free
# PostgreSQL database. In Render: New > Blueprint > pick this repository.
databases:
  - name: aiva-crm-db
    plan: free
    region: ohio
    databaseName: aiva_crm
    user: aiva
    postgresMajorVersion: "16"

services:
  - type: web
    runtime: docker
    name: aiva-crm
    plan: free
    region: ohio
    dockerfilePath: ./deploy/Dockerfile
    dockerContext: .
    healthCheckPath: /login
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: aiva-crm-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      # Password for the demo sign-ins (admin@aiva.local, …). Render asks for it once.
      - key: AIVA_DEV_PASSWORD
        sync: false
      - key: ENVIRONMENT
        value: production
      # No email service is connected, so show invite / reset links on screen.
      - key: SHOW_LINKS_WITHOUT_EMAIL
        value: "true"
      - key: REDIS_URL
        value: disabled
