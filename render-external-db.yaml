# Render Blueprint (alternative): one free web service that connects to a
# database you already have — for example a free Neon PostgreSQL database.
# Use this when your Render workspace already has its one free database.
# In Render: New > Blueprint > this repository > Blueprint path: render-external-db.yaml
services:
  - type: web
    runtime: docker
    name: aiva-crm
    plan: free
    region: ohio
    dockerfilePath: ./deploy/Dockerfile
    dockerContext: .
    healthCheckPath: /login
    autoDeployTrigger: commit
    envVars:
      # PostgreSQL connection string, e.g. from Neon: postgresql://user:pass@host/db?sslmode=require
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true
      # Password for the demo sign-ins (admin@aiva.local, …).
      - key: AIVA_DEV_PASSWORD
        sync: false
      - key: ENVIRONMENT
        value: production
      - key: SHOW_LINKS_WITHOUT_EMAIL
        value: "true"
      - key: REDIS_URL
        value: disabled
      # Optional — add these in the Render dashboard (Environment) when you want them:
      #   STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET   real card billing (otherwise demo billing)
      #   SMTP_HOST, SMTP_PORT, SMTP_USERNAME, SMTP_PASSWORD, SMTP_FROM_EMAIL   outgoing email
      #   ANTHROPIC_API_KEY   Claude for AI summaries, drafts and Ask AIVA
      #   FIELD_ENCRYPTION_KEY   explicit key for encrypted fields (defaults to one derived from JWT_SECRET_KEY)
