services:
  postgres:
    image: postgres:18-alpine
    container_name: aiva-postgres

    environment:
      POSTGRES_DB: aiva_crm
      POSTGRES_USER: aiva
      POSTGRES_PASSWORD: aiva_local_dev

    ports:
      - "5432:5432"

    volumes:
      - aiva_postgres_data:/var/lib/postgresql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U aiva -d aiva_crm"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

    restart: unless-stopped


  redis:
    image: redis:8-alpine
    container_name: aiva-redis

    command:
      [
        "redis-server",
        "--appendonly",
        "yes"
      ]

    ports:
      - "6379:6379"

    volumes:
      - aiva_redis_data:/data

    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "ping"
        ]
      interval: 5s
      timeout: 3s
      retries: 10

    restart: unless-stopped


  migrate:
    build:
      context: ./apps/api

    container_name: aiva-migrate

    network_mode: host

    environment:
      ENVIRONMENT: development
      DATABASE_URL: postgresql+asyncpg://aiva:aiva_local_dev@127.0.0.1:5432/aiva_crm
      REDIS_URL: redis://127.0.0.1:6379/0

    command:
      [
        "alembic",
        "upgrade",
        "head"
      ]

    depends_on:
      postgres:
        condition: service_healthy

    restart: "no"


  bootstrap:
    build:
      context: ./apps/api

    container_name: aiva-bootstrap

    network_mode: host

    environment:
      ENVIRONMENT: development
      DATABASE_URL: postgresql+asyncpg://aiva:aiva_local_dev@127.0.0.1:5432/aiva_crm
      REDIS_URL: redis://127.0.0.1:6379/0

    command:
      [
        "python",
        "-m",
        "app.scripts.bootstrap_dev"
      ]

    depends_on:
      migrate:
        condition: service_completed_successfully

    restart: "no"


  api:
    build:
      context: ./apps/api

    container_name: aiva-api

    network_mode: host

    environment:
      ENVIRONMENT: development
      DATABASE_URL: postgresql+asyncpg://aiva:aiva_local_dev@127.0.0.1:5432/aiva_crm
      REDIS_URL: redis://127.0.0.1:6379/0

    depends_on:
      bootstrap:
        condition: service_completed_successfully

      redis:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')"
        ]
      interval: 5s
      timeout: 5s
      retries: 12

    restart: unless-stopped


  web:
    build:
      context: ./apps/web

    container_name: aiva-web

    environment:
      AIVA_INTERNAL_API_URL: http://host.docker.internal:8000/api/v1
      AIVA_ORGANIZATION_ID: 10000000-0000-0000-0000-000000000001

    extra_hosts:
      - "host.docker.internal:host-gateway"

    ports:
      - "3000:3000"

    depends_on:
      api:
        condition: service_healthy

    restart: unless-stopped


volumes:
  aiva_postgres_data:
  aiva_redis_data:
