  web:
    build:
      context: ./apps/web

    container_name: aiva-web

    environment:
      AIVA_INTERNAL_API_URL: http://host.docker.internal:8000/api/v1
      AIVA_ORGANIZATION_ID: 10000000-0000-0000-0000-000000000001

    extra_hosts:
      - "host.docker.internal:host-gateway"

    ports:
      - "3000:3000"

    depends_on:
      api:
        condition: service_healthy

    restart: unless-stopped
